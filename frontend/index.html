<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Budget Meal Planner — Demo</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root { --fc:#fc8019; --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --txt:#e6e8ec; --mut:#8b93a3; --ok:#39d353; --no:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  .wrap { max-width:1100px; margin:0 auto; padding:24px; }
  h1 { font-size:22px; margin:0 0 4px; } h1 span { color:var(--fc); }
  .sub { color:var(--mut); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 4px; }
  input, select { width:100%; padding:9px 11px; background:#12151b; border:1px solid var(--line); border-radius:8px; color:var(--txt); font-size:14px; }
  button { background:var(--fc); color:#000; border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .row > div { flex:1; min-width:120px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill.ok { background:rgba(57,211,83,.15); color:var(--ok); }
  .pill.bad { background:rgba(255,92,92,.15); color:var(--no); }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .day { background:#12151b; border:1px solid var(--line); border-radius:8px; padding:8px; min-height:96px; }
  .day .d { font-size:11px; color:var(--mut); margin-bottom:6px; }
  .meal { font-size:11px; padding:4px 6px; border-radius:6px; margin-bottom:4px; cursor:pointer; background:#1a1d24; border:1px solid transparent; }
  .meal:hover { border-color:var(--fc); }
  .meal .mt { color:var(--fc); font-weight:600; }
  .meal.confirmed { border-left:3px solid var(--ok); }
  .meal.skipped { opacity:.45; text-decoration:line-through; }
  .stat { display:flex; gap:24px; flex-wrap:wrap; }
  .stat div b { display:block; font-size:20px; }
  .stat div span { font-size:11px; color:var(--mut); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; width:420px; max-width:92vw; }
  .alt { display:flex; justify-content:space-between; align-items:center; padding:8px; border:1px solid var(--line); border-radius:8px; margin-top:6px; }
  .muted { color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const API = "http://localhost:8000";

async function api(path, method="GET", body) {
  const r = await fetch(API + path, {
    method, headers:{"Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

const MEALS = ["breakfast","lunch","dinner"];

function App() {
  const [userId, setUserId] = useState(null);
  const [text, setText] = useState("10k budget, at least 10 paneer meals, veg only, heavy eater");
  const [month, setMonth] = useState("2026-07");
  const [parsed, setParsed] = useState(null);
  const [appetite, setAppetite] = useState("heavy");
  const [plan, setPlan] = useState(null);
  const [slots, setSlots] = useState([]);
  const [wallet, setWallet] = useState(null);
  const [modal, setModal] = useState(null);   // {slot, notif, alts}
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const run = (fn) => async (...a) => {
    setErr(null); setBusy(true);
    try { await fn(...a); } catch(e){ setErr(e.message); } finally { setBusy(false); }
  };

  const doIntake = run(async () => {
    const u = await api("/user","POST",{name:"Demo User", area:"Bandra"});
    setUserId(u.user_id);
    const p = await api("/intake","POST",{user_id:u.user_id, text});
    setParsed(p);
    if (p.appetite_level) setAppetite(p.appetite_level);
  });

  const doPlan = run(async () => {
    await api("/appetite","POST",{user_id:userId, appetite_level:appetite});
    const res = await api("/plan","POST",{
      user_id:userId, month, budget:parsed.budget||10000,
      constraints:parsed.constraints, veg_only:parsed.veg_only, days:30,
    });
    setPlan(res);
    const full = await api(`/plan/${res.plan_id}`);
    setSlots(full.slots);
  });

  const doApprove = run(async () => {
    const r = await api(`/plan/${plan.plan_id}/approve`,"POST");
    setWallet(r.wallet);
  });

  const openSlot = run(async (slot) => {
    const notif = await api(`/slot/${slot.id}/notify`,"POST");
    setModal({ slot, notif, alts:null });
  });

  const respond = run(async (answer) => {
    const slot = modal.slot;
    if (answer === "other") {
      const a = await api(`/slot/${slot.id}/alternatives?band=100&veg_only=${parsed.veg_only}`);
      setModal({ ...modal, alts:a.alternatives });
      return;
    }
    await api(`/slot/${slot.id}/respond`,"POST",{answer});
    await refresh();
    setModal(null);
  });

  const pickAlt = run(async (alt) => {
    // swap = order the alternative directly (demo): respond yes after visually swapping
    await api(`/slot/${modal.slot.id}/respond`,"POST",{answer:"yes"});
    await refresh();
    setModal(null);
  });

  const refresh = async () => {
    const full = await api(`/plan/${plan.plan_id}`);
    setSlots(full.slots);
    setWallet(await api(`/wallet/${userId}/${month}`));
  };

  const days = {};
  slots.forEach(s => { (days[s.day] ||= {})[s.meal_type] = s; });

  return (
    <div className="wrap">
      <h1><span>🍱</span> Budget Meal Planner</h1>
      <div className="sub">Monthly budget → auto meal calendar → order per slot → rollover unused as Swiggy Cash</div>
      {err && <div className="card" style={{borderColor:"var(--no)",color:"var(--no)"}}>{err}</div>}

      {/* 1. intake */}
      <div className="card">
        <label>Tell it your budget & must-haves</label>
        <input value={text} onChange={e=>setText(e.target.value)} />
        <div className="row" style={{marginTop:10}}>
          <div><label>Month</label><input value={month} onChange={e=>setMonth(e.target.value)} /></div>
          <div style={{flex:0}}><label>&nbsp;</label>
            <button disabled={busy} onClick={doIntake}>Parse</button></div>
        </div>
        {parsed && <div className="muted" style={{marginTop:10}}>
          budget ₹{parsed.budget} · constraints {JSON.stringify(parsed.constraints)} ·
          veg {String(parsed.veg_only)} · appetite {parsed.appetite_level||"?"} ·
          <span className="pill ok" style={{marginLeft:6}}>{parsed.source}</span>
        </div>}
      </div>

      {/* 2. appetite + plan */}
      {parsed && <div className="card">
        <div className="row">
          <div><label>Appetite</label>
            <select value={appetite} onChange={e=>setAppetite(e.target.value)}>
              {["light","moderate","heavy","very_heavy"].map(l=><option key={l}>{l}</option>)}
            </select></div>
          <div style={{flex:0}}><label>&nbsp;</label>
            <button disabled={busy} onClick={doPlan}>Build month plan</button></div>
        </div>
      </div>}

      {/* 3. plan summary */}
      {plan && <div className="card">
        <div className="stat">
          <div><b>₹{plan.budget}</b><span>budget</span></div>
          <div><b>₹{plan.total_cost}</b><span>planned</span></div>
          <div><b>₹{plan.leftover}</b><span>leftover</span></div>
          <div><b>{plan.feasible
            ? <span className="pill ok">feasible</span>
            : <span className="pill bad">tight</span>}</b><span>status</span></div>
          <div style={{flex:1,textAlign:"right"}}>
            <button disabled={busy} onClick={doApprove}>Approve & activate</button></div>
        </div>
        <div className="muted" style={{marginTop:10}}>{plan.message}</div>
      </div>}

      {/* wallet */}
      {wallet && <div className="card">
        <div className="stat">
          <div><b>₹{wallet.balance}</b><span>Swiggy Cash balance</span></div>
          <div><b>₹{wallet.total_spent}</b><span>spent</span></div>
          <div><b>₹{wallet.rolled_in}</b><span>rolled in</span></div>
          <div><b>{wallet.status}</b><span>cycle</span></div>
        </div>
      </div>}

      {/* 4. calendar */}
      {slots.length>0 && <div className="card">
        <div className="grid">
          {Object.keys(days).map(d => (
            <div className="day" key={d}>
              <div className="d">Day {d}</div>
              {MEALS.map(mt => {
                const s = days[d][mt];
                if (!s) return null;
                return <div key={mt} className={"meal "+s.status}
                  onClick={()=> s.status==="planned" && openSlot(s)}>
                  <span className="mt">{mt[0].toUpperCase()}</span> {s.dish_name}
                  <div className="muted">₹{s.price}</div>
                </div>;
              })}
            </div>
          ))}
        </div>
      </div>}

      {/* modal: notify -> yes/no/later/other */}
      {modal && <div className="modal-bg" onClick={()=>setModal(null)}>
        <div className="modal" onClick={e=>e.stopPropagation()}>
          {!modal.alts ? <>
            <div style={{marginBottom:14}}>{modal.notif.prompt}</div>
            <div className="row">
              <button onClick={()=>respond("yes")}>Yes, order</button>
              <button className="ghost" onClick={()=>respond("no")}>No</button>
              <button className="ghost" onClick={()=>respond("later")}>Later</button>
              <button className="ghost" onClick={()=>respond("other")}>Something else</button>
            </div>
          </> : <>
            <div style={{marginBottom:10}}>Alternatives in ±₹100:</div>
            {modal.alts.length===0 && <div className="muted">No alternatives in band.</div>}
            {modal.alts.map(a => (
              <div className="alt" key={a.dish_id}>
                <div>{a.name} <span className="muted">· {a.restaurant_name} · ⭐{a.rating}</span></div>
                <div><b>₹{a.price}</b> <button onClick={()=>pickAlt(a)}>Pick</button></div>
              </div>
            ))}
          </>}
        </div>
      </div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
